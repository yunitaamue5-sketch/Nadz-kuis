<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nadz Smart Kuis</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#0f172a;color:#fff;padding:10px;display:flex;justify-content:center;min-height:100vh}.box{background:#1e293b;width:100%;max-width:600px;border-radius:16px;padding:20px;border:1px solid #475569;position:relative}.fs{position:fixed;top:10px;right:10px;background:#3b82f6;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;z-index:99;font-weight:bold}.h{text-align:center;margin-bottom:20px}.h h1{font-size:1.5rem;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.3)}.h p{font-size:.85rem;color:#e2e8f0;margin-top:5px}.lbl{font-size:1rem;font-weight:bold;margin:20px 0 10px;color:#fde047;background:rgba(253,224,71,.15);padding:10px 14px;border-radius:8px;border-left:5px solid #fde047;display:flex;align-items:center;gap:8px;text-shadow:0 1px 2px rgba(0,0,0,.5)}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.card,.jbtn{background:#0f172a;border:2px solid #475569;border-radius:10px;padding:12px 5px;text-align:center;cursor:pointer;transition:.2s;font-size:.9rem;font-weight:bold;color:#f8fafc}.card:hover,.jbtn:hover{border-color:#60a5fa;color:#fff}.card.act,.jbtn.act{background:#2563eb;border-color:#60a5fa;color:#fff;box-shadow:0 0 15px rgba(59,130,246,.5)}.card .ic{font-size:24px;display:block;margin-bottom:5px}.info{font-size:.85rem;color:#fef08a;background:rgba(253,224,71,.1);padding:12px;border-radius:8px;margin-top:15px;text-align:center;border:1px solid rgba(253,224,71,.3)}.btn{width:100%;padding:15px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-weight:bold;font-size:1.05rem;margin-top:15px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}.btn:disabled{background:#475569;color:#94a3b8;opacity:.7;box-shadow:none}.btn:hover:not(:disabled){background:#3b82f6}.hide{display:none!important}.prog{height:8px;background:#0f172a;border-radius:4px;margin-bottom:12px;overflow:hidden}.fill{height:100%;width:0;background:#3b82f6;transition:.3s}.meta{display:flex;justify-content:space-between;font-size:.85rem;font-weight:bold;margin-bottom:12px;color:#e2e8f0}.q{background:#0f172a;padding:16px;border-radius:10px;border-left:5px solid #3b82f6;margin-bottom:15px;font-size:1rem;line-height:1.5;color:#fff}.opt{background:#0f172a;border:2px solid #475569;border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:center;font-size:.95rem;transition:.2s;width:100%;text-align:left;color:#f8fafc}.opt:hover:not(:disabled){border-color:#60a5fa;background:rgba(59,130,246,.1)}.opt .h{width:26px;height:26px;background:#334155;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.85rem;flex-shrink:0;color:#fff}.opt.ok{border-color:#10b981;background:rgba(16,185,129,.2);color:#fff}.opt.ok .h{background:#10b981}.opt.no{border-color:#ef4444;background:rgba(239,68,68,.2);color:#fff}.opt.no .h{background:#ef4444}.fb{margin-top:12px;padding:12px;border-radius:8px;font-size:.9rem;display:none;font-weight:bold}.fb.show{display:block}.fb.ok{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid #10b981}.fb.no{background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid #ef4444}.res{text-align:center}.res .em{font-size:60px}.res h2{color:#fff;margin-top:10px}.res .sc{font-size:3rem;font-weight:bold;color:#60a5fa;margin:15px 0;text-shadow:0 0 15px rgba(96,165,250,.4)}.stats{display:flex;justify-content:center;gap:10px;margin:20px 0}.st{background:#0f172a;padding:12px;border-radius:10px;min-width:80px;border:1px solid #475569}.st .n{font-size:1.4rem;font-weight:bold;color:#fff}.st .n.ok{color:#34d399}.st .n.no{color:#f87171}.st .t{font-size:.75rem;color:#cbd5e1;margin-top:4px;font-weight:bold}.row{display:flex;gap:10px;margin-top:20px}.row .btn{margin-top:0}.btn.alt{background:transparent;border:2px solid #64748b;color:#f8fafc}.btn.alt:hover{background:rgba(255,255,255,.1)}</style></head><body><button class="fs" onclick="fs()">⛶ Fullscreen</button><div class="box" id="app"><div class="h"><h1>🧠 Nadz Smart Kuis</h1><p>Pilih mapel & jumlah soal</p></div><div id="setup"><div class="lbl">1. Pilih Mata Pelajaran</div><div class="grid" id="mgrid"></div><div class="lbl">2. Pilih Jumlah Soal</div><div class="grid" style="grid-template-columns:1fr 1fr 1fr"><button class="jbtn" onclick="setJ(5,this)">5</button><button class="jbtn" onclick="setJ(10,this)">10</button><button class="jbtn" onclick="setJ(15,this)">15</button></div><div class="info" id="info">Pilih mapel di atas.</div><button class="btn" id="startBtn" onclick="start()" disabled>🚀 Mulai Kuis</button></div><div id="play" class="hide"><div class="meta"><span id="qtxt">Soal 1</span><span id="tag">Mapel</span><span id="sc">⭐ 0</span></div><div class="prog"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div id="opts"></div><div class="fb" id="fb"></div><button class="btn hide" id="next" onclick="next()">Lanjut ➜</button></div><div id="res" class="hide res"><div class="em" id="rem">🏆</div><h2 id="rtitle">Selesai!</h2><div class="sc" id="rsc">0</div><div class="stats"><div class="st"><div class="n ok" id="rb">0</div><div class="t">Benar</div></div><div class="st"><div class="n no" id="rs">0</div><div class="t">Salah</div></div><div class="st"><div class="n" id="rt">0</div><div class="t">Total</div></div></div><p id="rmsg" style="font-size:.95rem;color:#f1f5f9;margin-bottom:15px;font-weight:bold"></p><div class="row"><button class="btn" onclick="start()">🔄 Ulangi</button><button class="btn alt" onclick="back()">📚 Ganti Mapel</button></div></div></div><script>
const db={
"Matematika":{i:"🧮",s:[["12 × 8 =",["86","96","106","116"],1],["144 ÷ 12 =",["10","11","12","13"],2],["25 + 37 - 15 =",["45","47","49","51"],1],["Keliling persegi sisi 9 cm",["18 cm","27 cm","36 cm","81 cm"],2],["7² + 3² =",["52","56","58","64"],2],["Desimal dari 3/4",["0,25","0,50","0,75","0,80"],2],["2x + 6 = 20, x =",["5","6","7","8"],2],["Luas segitiga a=10 t=6",["30 cm²","40 cm²","50 cm²","60 cm²"],0],["FPB 24 & 36",["6","8","12","18"],2],["KPK 4 & 6",["10","12","18","24"],1],["15% dari 200",["20","25","30","35"],2],["5³ =",["15","75","125","225"],2],["Sudut 90° disebut",["Lancip","Tumpul","Siku-siku","Lurus"],2],["Rata-rata 4,6,8,10",["6","7","8","9"],1],["2,5 × 4 =",["8","9","10","12"],2]]},
"B. Indonesia":{i:"📖",s:[["Kata baku benar",["Aktifitas","Aktivitas","Aktipitas","Aktifitet"],1],["Sinonim 'pintar'",["Bodoh","Cerdas","Malas","Rajin"],1],["Antonim 'tinggi'",["Besar","Rendah","Panjang","Luas"],1],["Tanda baca benar",["Saya pergi ke pasar.","saya pergi ke pasar","Saya pergi ke pasar","SAYA PERGI KE PASAR"],0],["Puisi 4 baris",["Pantun","Syair","Gurindam","Karmina"],0],["'Meja' kata?",["Kerja","Benda","Sifat","Bilangan"],1],["Kata depan benar",["dipasar","di pasar","di-pasar","dipasar."],1],["Ide pokok paragraf",["Kalimat utama","Kalimat penjelas","Kata hubung","Kata sifat"],0],["Majas membandingkan",["Metafora","Hiperbola","Personifikasi","Metonimia"],0],["Lawan 'gemuk'",["Kurus","Pendek","Tinggi","Kecil"],0],["Kata 'cantik' termasuk",["Benda","Kerja","Sifat","Bilangan"],2],["Cerita hewan disebut",["Fabel","Legenda","Mite","Dongeng"],0],["Kalimat tanya diakhiri",["Titik","Koma","Tanya","Seru"],2],["Penulisan judul benar",["belajar b. indonesia","Belajar Bahasa Indonesia","belajar Bahasa Indonesia","BELAJAR BAHASA INDONESIA"],1],["Kata 'berlari' jenis",["Benda","Kerja","Sifat","Depan"],1]]},
"IPA":{i:"🔬",s:[["Planet terdekat Matahari",["Venus","Bumi","Merkurius","Mars"],2],["Tumbuhan membuat makanan",["Respirasi","Fotosintesis","Transpirasi","Oksidasi"],1],["Alat napas manusia",["Jantung","Paru-paru","Hati","Ginjal"],1],["Hewan bertelur disebut",["Vivipar","Ovipar","Ovovivipar","Mamalia"],1],["Satuan gaya SI",["Joule","Newton","Watt","Pascal"],1],["Zat untuk fotosintesis",["Oksigen","Karbon dioksida","Nitrogen","Helium"],1],["Pusat pengatur sel",["Sitoplasma","Membran","Inti sel","Dinding sel"],2],["Gas ke cair disebut",["Menguap","Mengembun","Membeku","Mencair"],1],["Organ pemompa darah",["Paru-paru","Jantung","Hati","Lambung"],1],["Penghantar listrik",["Isolator","Konduktor","Semikonduktor","Resistor"],1],["Matahari terbit dari",["Utara","Selatan","Timur","Barat"],2],["Gas untuk bernapas",["Karbon dioksida","Oksigen","Nitrogen","Hidrogen"],1],["Bunyi merambat melalui",["Ruang hampa","Udara","Vakum","Cahaya"],1],["Mamalia bernapas dengan",["Insang","Paru-paru","Kulit","Trakea"],1],["Energi terbesar bumi",["Bulan","Bintang","Matahari","Angin"],2]]},
"IPS":{i:"🌍",s:[["Ibu kota Indonesia",["Bandung","Jakarta","Surabaya","Medan"],1],["Benua terbesar",["Afrika","Asia","Eropa","Amerika"],1],["Samudra terluas",["Atlantik","Hindia","Pasifik","Arktik"],2],["Gunung tertinggi Indonesia",["Semeru","Merapi","Puncak Jaya","Rinjani"],2],["Negeri Sakura",["Korea","Jepang","China","Thailand"],1],["Alat tukar barter",["Uang","Barang","Emas","Perak"],1],["Provinsi paling barat",["Aceh","Sumut","Bengkulu","Lampung"],0],["Danau terluas Indonesia",["Toba","Sentani","Singkarak","Poso"],0],["Candi Borobudur di",["Jatim","Jateng","Jabar","DIY"],1],["Pembuat UU",["Presiden","DPR","MA","BPK"],1],["Ibu kota Jepang",["Seoul","Tokyo","Beijing","Bangkok"],1],["Benua terkecil",["Asia","Australia","Eropa","Antartika"],1],["Selat antara Jawa & Sumatera",["Sunda","Malaka","Karimata","Lombok"],0],["Pulau terbesar Indonesia",["Jawa","Sumatera","Kalimantan","Papua"],2],["Hari Pahlawan",["10 Nov","17 Agu","28 Okt","1 Jun"],0]]},
"PKN":{i:"🇮🇩",s:[["Dasar negara",["UUD 1945","Pancasila","Bhinneka","GBHN"],1],["Semboyan negara",["Pancasila","Bhinneka Tunggal Ika","Garuda","Merdeka"],1],["Sila 1 lambang",["Rantai","Bintang","Beringin","Banteng"],1],["Hari Kemerdekaan",["17 Agustus","1 Juni","28 Oktober","10 November"],0],["Lambang negara",["Merah Putih","Garuda Pancasila","Bhinneka","Bendera"],1],["Sila ke-3 bunyi",["Ketuhanan","Persatuan Indonesia","Kemanusiaan","Keadilan"],1],["Musyawarah sila ke",["1","2","3","4"],3],["Pembukaan UUD alinea",["2","3","4","5"],2],["Pengesah Pancasila",["BPUPKI","PPKI","KNIP","MPR"],1],["Sila ke-5 contoh",["Beribadah","Bantu korban bencana","Kerja bakti","Hargai pendapat"],1],["Jumlah sila Pancasila",["3","4","5","6"],2],["Sila ke-2 lambang",["Bintang","Rantai","Beringin","Padi kapas"],1],["Sila ke-4 lambang",["Banteng","Bintang","Rantai","Padi"],0],["Sila ke-5 lambang",["Bintang","Rantai","Padi & Kapas","Beringin"],2],["Bhinneka artinya",["Berbeda","Satu","Bersama","Bersatu"],0]]},
"B. Inggris":{i:"🔤",s:[["'Buku' in English",["Pencil","Book","Table","Chair"],1],["Sun rises in the",["West","North","East","South"],2],["I ___ a student",["am","is","are","be"],0],["Antonym of 'Big'",["Large","Huge","Small","Tall"],2],["We use ___ to write",["Ruler","Eraser","Pen","Bag"],2],["Plural of 'Child'",["Childs","Children","Childes","Childrens"],1],["Good morning, how are you?",["Good night","I am fine, thank you","Thank you","You are welcome"],1],["'Kucing' in English",["Dog","Bird","Cat","Fish"],2],["Father's brother is my",["Uncle","Aunt","Cousin","Brother"],0],["One, two, three, ...",["Five","Six","Four","Seven"],2],["'Merah' in English",["Blue","Red","Green","Yellow"],1],["I ___ to school everyday",["go","goes","going","gone"],0],["What is your name?",["I am fine","My name is Budi","Thank you","Goodbye"],1],["'Apel' in English",["Orange","Apple","Banana","Mango"],1],["Days after Monday",["Sunday","Tuesday","Friday","Saturday"],1]]},
"Informatika":{i:"💻",s:[["Perangkat keras komputer disebut",["Software","Hardware","Brainware","Malware"],1],["Otak dari komputer adalah",["RAM","Hardisk","CPU","Monitor"],2],["Perangkat untuk mencetak dokumen",["Scanner","Printer","Proyektor","Speaker"],1],["HTML singkatan dari",["HyperText Markup Language","High Tech Modern Language","HyperTool Multi Language","Home Text Markup Language"],0],["Bahasa pemrograman untuk web",["Python","Java","JavaScript","C++"],2],["Memori sementara di komputer",["ROM","RAM","HDD","SSD"],1],["Alat penunjuk pada layar komputer",["Keyboard","Mouse","Printer","Scanner"],1],["Sistem operasi buatan Microsoft",["Linux","macOS","Windows","Android"],2],["1 Byte sama dengan berapa Bit?",["4","8","16","32"],1],["Jaringan komputer global disebut",["Intranet","Internet","Ethernet","Bluetooth"],1],["Pencipta WWW (World Wide Web)",["Bill Gates","Steve Jobs","Tim Berners-Lee","Mark Zuckerberg"],2],["Kepanjangan dari CPU",["Central Process Unit","Central Processing Unit","Computer Personal Unit","Control Program Unit"],1],["Aplikasi pengolah kata",["Excel","Word","PowerPoint","Photoshop"],1],["Kode biner hanya terdiri dari angka",["0 dan 1","1 dan 2","0 sampai 9","A dan B"],0],["Perangkat penyimpanan data permanen",["RAM","ROM","Hardisk","Cache"],2]]}};
const L=["A","B","C","D"];
let mp=null,jml=5,soal=[],idx=0,skor=0,ok=0,no=0,locked=false;
const $=id=>document.getElementById(id);
const mg=$("mgrid");
for(const k in db){const d=document.createElement("div");d.className="card";d.innerHTML=`<span class="ic">${db[k].i}</span>${k}`;d.onclick=()=>{document.querySelectorAll(".card").forEach(c=>c.classList.remove("act"));d.classList.add("act");mp=k;$("info").innerHTML=`Tersedia <b>${db[k].s.length} soal</b> untuk <b>${k}</b>`;$("startBtn").disabled=false};mg.appendChild(d)}
function setJ(n,b){document.querySelectorAll(".jbtn").forEach(x=>x.classList.remove("act"));b.classList.add("act");jml=n}
function start(){if(!mp)return;let a=[...db[mp].s].sort(()=>Math.random()-.5);let lim=jml===0?a.length:jml;if(lim>a.length)lim=a.length;soal=a.slice(0,lim);idx=0;skor=0;ok=0;no=0;$("sc").textContent="⭐ 0";$("tag").textContent=db[mp].i+" "+mp;$("setup").classList.add("hide");$("res").classList.add("hide");$("play").classList.remove("hide");render()}
function render(){locked=false;const d=soal[idx];$("qtxt").textContent=`Soal ${idx+1} dari ${soal.length}`;$("fill").style.width=(idx/soal.length*100)+"%";$("q").innerHTML=`<span style="color:#fde047;font-weight:bold">${idx+1}.</span> ${d[0]}`;const o=$("opts");o.innerHTML="";d[1].forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="h">${L[i]}</span><span>${t}</span>`;b.onclick=()=>jawab(i,b);o.appendChild(b)});$("fb").className="fb";$("fb").innerHTML="";$("next").classList.add("hide");$("next").textContent=idx===soal.length-1?"Lihat Hasil 🏁":"Soal Selanjutnya ➜"}
function jawab(p,b){if(locked)return;locked=true;const d=soal[idx];const all=document.querySelectorAll(".opt");all.forEach(x=>x.disabled=true);if(p===d[2]){b.classList.add("ok");skor+=10;ok++;$("fb").className="fb ok show";$("fb").innerHTML="✅ <b>Benar!</b>"}else{b.classList.add("no");all[d[2]].classList.add("ok");no++;$("fb").className="fb no show";$("fb").innerHTML=`❌ <b>Salah.</b> Jawaban: <b>${L[d[2]]}. ${d[1][d[2]]}</b>`}$("sc").textContent="⭐ "+skor;$("fill").style.width=((idx+1)/soal.length*100)+"%";$("next").classList.remove("hide")}
function next(){idx++;if(idx<soal.length)render();else hasil()}
function hasil(){$("play").classList.add("hide");$("res").classList.remove("hide");const t=soal.length,pc=Math.round(ok/t*100);$("rsc").textContent=skor;$("rb").textContent=ok;$("rs").textContent=no;$("rt").textContent=t;let e,j,p;if(pc===100){e="🏆";j="Sempurna!";p="Luar biasa! Semua benar."}else if(pc>=80){e="🎉";j="Hebat Sekali!";p="Nilai sangat bagus!"}else if(pc>=60){e="😊";j="Bagus!";p="Tingkatkan lagi belajarnya."}else if(pc>=40){e="💡";j="Cukup Baik";p="Jangan menyerah, coba lagi."}else{e="📖";j="Belajar Lagi Yuk!";p="Ayo belajar lebih giat!"}$("rem").textContent=e;$("rtitle").textContent=j;$("rmsg").textContent=p}
function back(){$("res").classList.add("hide");$("setup").classList.remove("hide");mp=null;document.querySelectorAll(".card").forEach(c=>c.classList.remove("act"));$("startBtn").disabled=true;$("info").textContent="Pilih mapel di atas."}
function fs(){if(!document.fullscreenElement){document.documentElement.requestFullscreen()}else{document.exitFullscreen()}}
</script></body></html>
